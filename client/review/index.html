<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>FSG report approval</title><link rel="icon" href="../../fsg-logo.jpg"><link rel="stylesheet" href="../app.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="../report.js?v=7"></script><script src="../nbsp.js?v=1"></script></head><body>
<header class="top"><div class="wrap"><img src="../../fsg-logo.jpg" alt="FSG"><div class="brand"><b>Report approval</b><span>Internal: FSG staff only</span></div></div></header>
<main class="wrap" id="app"><p class="mut">Loading…</p></main>
<script>
const $=s=>document.querySelector(s);const t=new URLSearchParams(location.search).get("t")||undefined,o=new URLSearchParams(location.search).get("o")||undefined;
async function load(){let j;try{j=await call({op:"review_get",t,o})}catch(e){$("#app").innerHTML=`<div class="card">${esc(e.message)}</div>`;return}
 const r=j.report,me=j.me,d=r.data;const ST={in_review:"Awaiting approval",changes_requested:"Changes requested",published:"Published to the client",superseded:"Replaced by a newer version"};
 const DEC={approved:'<span class="pill G">Approved</span>',changes:'<span class="pill A">Changes requested</span>'};
 const issues=[...d.services.filter(s=>s.status==="Outstanding").map(s=>`${s.site}: ${s.service}${s.booked?" (booked "+fdm(s.booked)+")":" – not booked"}`),...d.month_visits.filter(v=>!v.done&&!v.booked).map(v=>`${v.job} ${v.site}: ${v.service} planned ${fdm(v.due)} – no completed or booked visit`)];
 const open=r.status==="in_review"||r.status==="changes_requested";
 $("#app").innerHTML=`<div class="card">${r.status!=="published"?`<div style="background:${(r.draft_day||1)>=21?"#c0392b":(r.draft_day||1)>=14?"#e67e22":(r.draft_day||1)>=7?"#2d6cdf":"#2f3337"};color:#fff;font-weight:800;font-size:22px;letter-spacing:1px;padding:10px 14px;border-radius:10px;margin-bottom:12px">DAY ${r.draft_day||1} DRAFT</div>`:""}<h2>${esc(j.account.name)} · ${esc(d.period_label)}: ${ST[r.status]||r.status}</h2>
  <table><tr><th>Approver</th><th>Role</th><th>Decision</th><th>Note</th></tr>${j.approvals.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.role)}</td><td>${DEC[a.decision]||'<span class="pill X">Waiting</span>'}</td><td class="sm">${esc(a.note||"")}</td></tr>`).join("")}</table>
  <div class="note" style="margin-top:14px"><b>Before you approve, please check (internal, not shown to the client):</b><ul style="margin:6px 0 0;padding-left:20px">${issues.slice(0,30).map(x=>`<li>${esc(x)}</li>`).join("")||"<li>No outstanding items.</li>"}</ul>
  <div class="sm mut" style="margin-top:6px">Items still open in JobLogic show to the client as "In progress" or "Booked".  If a visit was done but not closed in JobLogic, close it and ask for the report to be rebuilt.  The report shows sell values only.</div></div>${(()=>{const DF=r.internal;if(!DF||!DF.items||!DF.items.length)return"";const L={defect:"Defect, no follow-up found",overdue:"Overdue visit",not_closed:"Not closed in JobLogic",reactive_late:"Reactive past target",incomplete:"Closed with incomplete assets",no_access:"No access",late:"Completed late",quote_chase:"Quote to chase"};const P={high:"#c0392b",medium:"#8a5a00",low:"#6b7178"};
 const row=i=>`<tr><td><b style="color:${P[i.severity]}">${i.severity[0].toUpperCase()+i.severity.slice(1)}</b></td><td>${esc(L[i.type]||i.type)}</td><td>${esc(i.site||"")}</td><td>${esc(i.job||"")}</td><td>${esc(i.detail)}${i.follow_up?`<div class="sm mut">${esc(i.follow_up)}</div>`:""}<div class="sm"><b>${esc(i.action)}</b></div></td></tr>`;
 const main=DF.items.filter(i=>!["incomplete","late"].includes(i.type)),minor=DF.items.filter(i=>["incomplete","late"].includes(i.type));
 return `<div class="card" style="margin-top:14px;border-left:4px solid #c0392b"><h2>Service deficiencies (internal only)</h2><p class="sm mut">Found automatically in JobLogic: overdue or delayed visits, visits not closed, and defects the engineer recorded with no follow-up job or quote.  Please resolve these, or note why no action is needed, before approving.  None of this is shown to the client.</p>
 <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:8px">${Object.entries(DF.counts).map(([k,v])=>`<span class="tag">${esc(L[k]||k)}: ${v}</span>`).join("")}</div>
 <table><tr><th>Priority</th><th>Type</th><th>Site</th><th>Job</th><th>Detail and action</th></tr>${main.map(row).join("")||'<tr><td colspan="5">None.</td></tr>'}</table>
 ${minor.length?`<details style="margin-top:10px"><summary class="sm"><b>${minor.length} lower-priority items</b> (closed with incomplete assets, completed late)</summary><table>${minor.map(row).join("")}</table></details>`:""}</div>`})()}
  ${open?`<div style="margin-top:14px">${me.is_account_manager?`<label class="sm"><b>Your summary for the client</b> (account manager, required, shown at the top of the report)</label><textarea id="com">${esc(d.commentary||"")}</textarea>`:""}
   <label class="sm">Note (required if you request changes)</label><textarea id="note" style="min-height:70px"></textarea><div class="err" id="err"></div>
   <div class="row"><button class="pri" id="ok">${me.override?"Approve and publish now":"Approve for publication"}</button><button class="sec" id="ch">Request changes</button></div><p class="sm mut">You are ${esc(me.name)}, ${esc(me.role)}.${me.override?"  Approving here publishes the report straight away, even if other approvals are still outstanding.":""}${me.decision?"  You have already recorded a decision; you can change it until the report is published.":""}</p></div>`:""}
  </div><div class="row" style="justify-content:flex-end;margin-bottom:10px"><button class="ghost" id="pdf">Preview PDF</button></div><div id="rep"></div>`;
 renderReport($("#rep"),d,{banner:'<div class="banner">Preview: this is exactly what the client will see once all approvers have approved.</div>'});$("#pdf").onclick=()=>reportPdf(d);
 const dec=async x=>{$("#err").textContent="";try{await call({op:"review_decide",t,o,decision:x,note:$("#note").value,commentary:$("#com")?$("#com").value:undefined});load();window.scrollTo(0,0)}catch(e){$("#err").textContent=e.message}};
 if(open){$("#ok").onclick=()=>dec("approved");$("#ch").onclick=()=>dec("changes")}}
load();
</script></body></html>
