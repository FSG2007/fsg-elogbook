function npArea(k,label,ph="",help=""){return `<div style="grid-column:1/-1"><label class="sm">${label}</label><textarea data-k="${k}" rows="3" placeholder="${esc(ph)}" style="width:100%">${esc(NP.a[k]||"")}</textarea>${help?`<div class="sm mut">${help}</div>`:""}</div>`}
function npSel(k,label,opts,help=""){return `<div><label class="sm">${label}</label><select data-k="${k}">${opts.map(([v,l])=>`<option value="${esc(v)}"${String(NP.a[k])===String(v)?" selected":""}>${esc(l)}</option>`).join("")}</select>${help?`<div class="sm mut">${help}</div>`:""}</div>`}
function npTick(k,label,help=""){return `<label class="sm" style="display:flex;gap:8px;align-items:flex-start;margin:6px 0"><input type="checkbox" data-t="${k}" ${NP.a[k]?"checked":""} style="width:auto;margin-top:3px"><span>${label}${help?`<br><span class="mut">${help}</span>`:""}</span></label>`}
const NPSTEPS=[
 ["Client",()=>`<div class="g2">${npField("portal_name","Portal name *","e.g. St Mary's Square Developments","text","Shown at the top of the portal.  Usually the client's name.")}${npField("client_name","Client's legal name *","e.g. St Mary's Square Developments Ltd","text","Used on reports: \"Prepared for ...\".")}${npField("client_website","Client website","e.g. www.client.co.uk","text","Used to find their logo and brand colours.")}${npField("client_domains","Client email domain(s)","e.g. client.co.uk, client-group.com","text","Only people with these email addresses can be invited.")}</div>`],
 ["Sites",()=>`<div class="g2">${npField("jl_customer","JobLogic customer (name or ID) *","e.g. Garmin (Europe) Limited","text","The customer the work sits under in JobLogic.")}${npSel("sites_mode","Which sites?",[["all","All sites under this JobLogic customer"],["list","Only the sites listed below"]])}${npArea("sites","Sites (one per line)","e.g. Kings Building\nChurchill Buildings","Optional when \"all sites\" is chosen.  Add anything that's also under another customer, e.g. a managing agent's account.")}${npSel("has_agent","Is there a managing agent who should only see some sites?",[["no","No"],["yes","Yes"]])}</div>
 <div id="npag" class="${NP.a.has_agent==="yes"?"":"hide"}"><div class="g2">${npField("managing_agent","Managing agent's name","e.g. RJ Chartered Surveyors")}${npField("agent_website","Managing agent's website","e.g. www.agent.co.uk")}${npField("agent_domains","Managing agent's email domain(s)","e.g. agent.co.uk")}${npField("agent_sites","Sites they manage","e.g. Castle Quays")}${npSel("agent_billed","Do we invoice the managing agent for those sites?",[["yes","Yes: they see their own quotes and invoices only"],["no","No: they see visits and certificates, but no quotes or invoices"]])}${npField("agent_jl_customer","Managing agent's JobLogic customer (if different)","e.g. RJ Chartered Surveyors")}</div></div>`],
 ["FSG team",()=>`<div class="g2">${npSel("account_manager_email","Account manager *",[["","Choose…"],...STAFF.map(([n,e])=>[e,n]),["other","Someone else"]],"Receives every draft, client question and upload.")}<div id="npamo" class="${NP.a.account_manager_email==="other"?"":"hide"}">${npField("account_manager_other","Account manager's email","name@fsgfm.co.uk","email")}</div>${npArea("site_managers","Different contacts for particular sites (optional)","e.g. Castle Quays: Callum Edwards (RJ contract)\nKings Building: Lisa Cripps","Shown on the Contact page, site by site.")}${npSel("fy_month","Contract year starts in",MONTHS.map((m,i)=>[String(i+1),m]),"Used for \"invoiced this contract year\".")}</div>
 <label class="sm" style="margin-top:10px;display:block">Who approves each monthly report?  The account manager always does.</label>${STAFF.map(([n,e])=>`<label class="sm" style="display:inline-flex;gap:6px;margin:4px 14px 4px 0"><input type="checkbox" data-ap="${e}" ${NP.a.approvers.includes(e)?"checked":""} style="width:auto">${esc(n)}</label>`).join("")}`],
 ["Content",()=>`<p class="sm mut">Tick what the set-up agent should do.  Everything stays internal until approved.</p>
 ${npTick("do_dropbox","File the logbook from Dropbox","Certificates and reports from the client's Logbook folder.  Job cards, quotes, invoices, purchase orders and anything showing prices are left out, and every PDF is scanned for costs first.")}
 <div class="g2">${npField("dropbox_folder","Dropbox folder (optional)","e.g. Project Files (Locations)/Castle Quays","text","Leave blank and the agent will search Project Files (Locations).")}</div>
 ${npTick("do_manuals","Look for O&M manuals and guides online","Uses the makes and models in the JobLogic asset register.  Trade-only manuals are listed for you to request.")}
 ${npTick("do_branding","Apply the client's branding","Logo and colours from their website, or the logo you upload on the next step.")}
 <label class="sm" style="margin-top:10px;display:block">Sections the client can see (you can change these later in Settings)</label>${[["visits","Visits"],["services","Services"],["reactive","Reactive work"],["assets","Assets"],["files","File logbook"],["manuals","Manuals"],["quotes","Quotes"],["invoices","Invoices"]].map(([k,l])=>`<label class="sm" style="display:inline-flex;gap:6px;margin:4px 14px 4px 0"><input type="checkbox" data-sec="${k}" ${NP.a.sections[k]?"checked":""} style="width:auto">${l}</label>`).join("")}
 <div class="g2" style="margin-top:10px">${npField("close_down_days","Days to close down jobs before the report","14","number","Jobs completed within this many days of month end count towards that month.")}</div>`],
 ["Timing",()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const pm=d.toISOString().slice(0,7);if(!NP.a.first_period)NP.a.first_period=pm;return `<div class="g2">${npField("first_period","First report month","","month","Built straight away as a DAY 1 DRAFT for internal review.")}</div>
 ${npTick("do_trial","Test the portal and send me a demo login","The agent signs in as a test user, checks every tab, the PDF and mobile layout, then emails you a demo link.")}
 ${npTick("do_draft","Send the DAY 1 DRAFT to the approvers","Then DAY 7, DAY 14 and DAY 21 drafts to anyone who hasn't approved, as for Garmin.")}
 <div class="card" style="background:#f6f7f8;margin-top:10px"><p class="sm" style="margin:0"><b>Nothing goes to the client.</b>  The client isn't invited or emailed until Geraint, Barry or Luke says it can go live.</p></div>`}],
 ["Logo and notes",()=>`<div class="g2"><div><label class="sm">Client logo (optional)</label><input type="file" id="nplogo" accept="image/png,image/jpeg,image/svg+xml">${NP.a.logo_name?`<div class="sm mut">Attached: ${esc(NP.a.logo_name)}</div>`:""}<div class="sm mut">PNG or SVG works best.  Leave blank and the agent will find it.</div></div>${npArea("notes","Anything else the agent should know?","e.g. Copy Lisa on all emails for this client.  Exclude the old AHHG invoices.")}</div>`],
 ["Check and start",()=>{const a=NP.a;const am=a.account_manager_email==="other"?a.account_manager_other:a.account_manager_email;const row=(l,v)=>v?`<tr><td class="mut">${l}</td><td>${esc(v)}</td></tr>`:"";return `<table class="utbl">${row("Portal",a.portal_name)}${row("Client",a.client_name)}${row("JobLogic customer",a.jl_customer)}${row("Sites",a.sites_mode==="all"?"All sites under the customer"+(a.sites?"; plus: "+a.sites.replace(/\n/g,", "):""):(a.sites||"").replace(/\n/g,", "))}${a.has_agent==="yes"?row("Managing agent",`${a.managing_agent||""}: ${a.agent_sites||""}${a.agent_billed==="yes"?" (own quotes and invoices)":" (no quotes or invoices)"}`):""}${row("Account manager",am)}${row("Approvers",[am,...a.approvers].filter((x,i,s)=>x&&s.indexOf(x)===i).join(", "))}${row("Contract year starts",MONTHS[Number(a.fy_month)-1])}${row("First report",a.first_period)}${row("Agent will",[a.do_dropbox&&"file the Dropbox logbook",a.do_manuals&&"find manuals",a.do_branding&&"apply branding",a.do_trial&&"test and send you a demo login",a.do_draft&&"send the DAY 1 DRAFT to approvers"].filter(Boolean).join(", "))}</table><div class="err" id="nperr"></div>`}]
];
function npSave(){document.querySelectorAll("#npw [data-k]").forEach(i=>NP.a[i.dataset.k]=i.value.trim?i.value.trim():i.value);document.querySelectorAll("#npw [data-t]").forEach(i=>NP.a[i.dataset.t]=i.checked);
 const ap=document.querySelectorAll("#npw [data-ap]");if(ap.length)NP.a.approvers=[...ap].filter(i=>i.checked).map(i=>i.dataset.ap);
 const sc=document.querySelectorAll("#npw [data-sec]");if(sc.length)sc.forEach(i=>NP.a.sections[i.dataset.sec]=i.checked)}
function npCheck(){const a=NP.a,s=NP.step;if(s===0&&(!a.portal_name||!a.client_name))return"Please enter the portal name and the client's legal name.";if(s===1&&!a.jl_customer)return"Please enter the JobLogic customer.";if(s===1&&a.sites_mode==="list"&&!a.sites)return"Please list the sites.";if(s===1&&a.has_agent==="yes"&&(!a.managing_agent||!a.agent_sites))return"Please enter the managing agent and the sites they manage.";
 if(s===2){const am=a.account_manager_email==="other"?a.account_manager_other:a.account_manager_email;if(!/@fsgfm\.co\.uk$/i.test(am||""))return"Please choose the account manager (an @fsgfm.co.uk address)."}return""}
async function newPortal(msg=""){const A=$("#app");let L={requests:[]};try{L=await call({op:"onboard_list",session:S})}catch(e){}
 const st=NP.step,[title,body]=NPSTEPS[st];
 const prog=r=>{const s=r.steps||[];return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>#${r.id} ${esc((r.answers||{}).portal_name||"")}</b><span class="tag ${r.status==="ready"?"ad":r.status==="error"?"pe":""}">${esc({requested:"Waiting for the next check",queued:"Waiting for the next check",running:"In progress",ready:"Ready for review",live:"Live",error:"Needs attention"}[r.status]||r.status)}</span></div><div class="sm mut">Requested by ${esc(r.requested_by)} on ${fd(String(r.created_at).slice(0,10))}</div><ul class="sm" style="margin:8px 0 0 18px">${s.map(x=>`<li>${x.state==="done"?"✓":x.state==="error"?"!":"…"} ${esc(x.label)}${x.detail?` <span class="mut">${esc(x.detail)}</span>`:""}</li>`).join("")}</ul>${r.result&&r.result.portal_link?`<p class="sm"><a href="${esc(r.result.portal_link)}">Open the portal</a></p>`:""}</div>`};
 A.innerHTML=`<div class="card" id="npw"><h2>Create a new client portal</h2><p class="sm mut">Answer a few questions and the set-up agent does the rest: JobLogic records, the Dropbox logbook, manuals, branding, a DAY 1 DRAFT and a full test.  Nothing is sent to the client.  Progress shows below.</p>
 <div class="sm" style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">${NPSTEPS.map((x,i)=>`<span class="tag ${i===st?"ad":""}">${i+1}. ${x[0]}</span>`).join("")}</div>${msg?`<p class="sm" style="color:#1e7e34">${esc(msg)}</p>`:""}
 <h3>${title}</h3>${body()}<div class="err" id="npe"></div><div style="display:flex;gap:8px;margin-top:12px">${st?`<button class="ghost" id="npb">Back</button>`:""}<div class="sp" style="flex:1"></div>${st<NPSTEPS.length-1?`<button class="pri" id="npn">Next</button>`:`<button class="pri" id="npgo">Start set-up</button>`}</div></div>
 ${L.requests.length?`<h2 style="margin-top:18px">Portal requests</h2>${L.requests.map(prog).join("")}`:""}`;
 const ag=$("#npw [data-k=has_agent]");if(ag)ag.onchange=e=>$("#npag").classList.toggle("hide",e.target.value!=="yes");
 const amS=$("#npw [data-k=account_manager_email]");if(amS)amS.onchange=e=>$("#npamo").classList.toggle("hide",e.target.value!=="other");
 const lg=$("#nplogo");if(lg)lg.onchange=()=>{const f=lg.files[0];if(!f)return;if(f.size>2.5e6){$("#npe").textContent="Please use a logo under 2.5 MB.";return}const r=new FileReader();r.onload=()=>{NP.a.logo_b64=String(r.result).split(",")[1];NP.a.logo_name=f.name;NP.a.logo_type=f.type};r.readAsDataURL(f)};
 if($("#npb"))$("#npb").onclick=()=>{npSave();NP.step--;newPortal()};
 if($("#npn"))$("#npn").onclick=()=>{npSave();const e=npCheck();if(e){$("#npe").textContent=e;return}NP.step++;newPortal()};
 if($("#npgo"))$("#npgo").onclick=async()=>{npSave();$("#npgo").disabled=true;const a={...NP.a};if(a.account_manager_email==="other")a.account_manager_email=a.account_manager_other;a.approvers=[a.account_manager_email,...a.approvers].filter((x,i,s)=>x&&s.indexOf(x)===i).join(", ");a.sections=JSON.stringify(a.sections);
  try{const j=await call({op:"onboard_create",session:S,answers:a});NP={step:0,a:{...NP.a,portal_name:"",client_name:"",client_website:"",client_domains:"",jl_customer:"",sites:"",managing_agent:"",agent_website:"",agent_domains:"",agent_sites:"",agent_jl_customer:"",site_managers:"",dropbox_folder:"",notes:"",logo_b64:"",logo_name:"",first_period:""}};newPortal(j.started?`Set-up started for request #${j.id}.  You'll get an email when it's ready for review.`:`Request #${j.id} saved.  The set-up agent starts at the next check (08:00 or 13:00 on weekdays) and emails you when it's ready for review.`)}catch(x){$("#npe").textContent=x.message;$("#npgo").disabled=false}}}
function resetView(em=""){$("#nav").classList.add("hide");$("#app").innerHTML=`<div class="login"><div class="card"><h1>Reset your password</h1><p class="mut sm">Enter the email address you use for the portal.  We'll email you a link to choose a new password.</p>
 <label class="sm">Email</label><input id="rem" type="email" autocomplete="username" value="${esc(em)}"><div class="err" id="err"></div><button class="pri" id="rgo" style="width:100%">Send reset link</button><p class="sm" style="margin-top:12px"><a href="#" id="back">Back to sign in</a></p></div></div>`;
 $("#back").onclick=e=>{e.preventDefault();loginView()};
 $("#rgo").onclick=async()=>{$("#rgo").disabled=true;try{const j=await call({op:"reset_request",email:$("#rem").value});$("#app").querySelector(".card").innerHTML=`<h1>Check your email</h1><p class="sm">${esc(j.message)}</p><p class="sm mut">Nothing arrived?  Check your junk folder, or contact your FSG account manager.</p><p class="sm"><a href="./">Back to sign in</a></p>`}catch(x){$("#err").textContent=x.message;$("#rgo").disabled=false}}}
// Microsoft 365 sign-in (FSG staff): authorisation code with PKCE, then the server verifies the ID token.
const b64u=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const MSR=location.origin+"/client/";
async function msStart(hint){const m=window._ms;const v=b64u(crypto.getRandomValues(new Uint8Array(32))),st=b64u(crypto.getRandomValues(new Uint8Array(16))),no=b64u(crypto.getRandomValues(new Uint8Array(16)));
 const ch=b64u(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));sessionStorage.setItem("fsg_ms",JSON.stringify({v,st,no,m}));
 const p=new URLSearchParams({client_id:m.client_id,response_type:"code",redirect_uri:MSR,scope:"openid profile email",state:st,nonce:no,code_challenge:ch,code_challenge_method:"S256",response_mode:"query",prompt:"select_account"});if(hint&&/@fsgfm\.co\.uk$/i.test(hint))p.set("login_hint",hint);
 location.href=`https://login.microsoftonline.com/${m.tenant}/oauth2/v2.0/authorize?${p}`}
async function msFinish(){const k=JSON.parse(sessionStorage.getItem("fsg_ms")||"null");sessionStorage.removeItem("fsg_ms");history.replaceState(null,"",location.pathname);
 if(qs.get("error")){loginView("Microsoft sign-in was cancelled or isn't available.  Please use your email and password.");return}
 if(!k||qs.get("state")!==k.st){loginView("Microsoft sign-in expired.  Please try again.");return}
 try{const r=await fetch(`https://login.microsoftonline.com/${k.m.tenant}/oauth2/v2.0/token`,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:k.m.client_id,grant_type:"authorization_code",code:qs.get("code"),redirect_uri:MSR,code_verifier:k.v,scope:"openid profile email"})});const t=await r.json();if(!t.id_token)throw new Error("Microsoft sign-in didn't work.  Please use your email and password.");
  const j=await call({op:"ms_login",id_token:t.id_token,nonce:k.no});S=j.session;localStorage.setItem("fsg_cp",S);localStorage.setItem("fsg_cp_em",j.email);load()}catch(e){loginView(e.message)}}
(qs.get("code")||qs.get("error"))&&sessionStorage.getItem("fsg_ms")?msFinish():qs.get("setup")?setupView(qs.get("setup")):S?load():loginView();
</script></body></html>
